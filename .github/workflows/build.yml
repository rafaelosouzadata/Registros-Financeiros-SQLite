name: Construindo executavel Flet com Nuitka

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # VM Linux

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # Correção 1: Adicionadas dependências do Linux necessárias para compilar C++ no Nuitka
    - name: Install Linux Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev

    - name: Install Dependencies
      # Correção 2: Alterada a sintaxe do PowerShell (Test-Path) para a sintaxe Bash do Linux
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install nuitka zstandard

    - name: Build Executable via Nuitka
      uses: Nuitka/Nuitka-Action@v1
      with:
        nuitka-version: 'stable'
        script-name: pagina_flet.py
        mode: 'onefile'
        disable-console: 'true' 
        include-package: 'flet,flet_core,python_pasta'
        include-package-data: 'flet'

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: registro-financeiro-flet-linux
        # Correção 3: No Linux, o Nuitka gera um arquivo binário sem extensão ou com extensão .bin
        path: |
          *.bin
          pagina_flet
