name: Construindo executavel Flet com Nuitka

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Linux Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev patchelf

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install nuitka zstandard

    - name: Build Executable via Nuitka
      run: |
        nuitka --mode=onefile --include-package=flet --include-package=python_pasta --include-package-data=flet --assume-yes-for-downloads --output-dir=build pagina_flet.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: registro-financeiro-flet-linux
        path: build/*.bin  # <--- No Linux o executável fica na pasta build com extensão .bin ou sem extensão
